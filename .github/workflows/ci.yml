name: Bash checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq openssh-client
      - name: Bash parse
        run: for file in install.sh bin/keel lib/*.sh tests/*.sh; do bash -n "$file"; done
      - name: ShellCheck
        run: shellcheck -x install.sh bin/keel lib/*.sh tests/*.sh
      - name: Unit tests
        run: bash tests/run.sh
