name: Bash checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash parse
        run: bash -n bin/keel lib/*.sh
      - name: ShellCheck
        run: shellcheck -x bin/keel lib/*.sh
      - name: Unit tests
        run: bash tests/smoke.sh
